<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player Insights · Stapleford Monday Night Pool Team</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --baize: #0f5a3c;
    --baize-dark: #08402a;
    --rail: #5a2e1b;
    --rail-light: #7a4127;
    --brass: #d4a94f;
    --chalk: #6fa8dc;
    --ivory: #f5f0e1;
    --red: #d22b2b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Barlow", "Helvetica Neue", Arial, sans-serif;
    color: var(--ivory);
    background:
      radial-gradient(ellipse at 50% 30%, rgba(255,255,255,0.10), transparent 60%),
      var(--baize);
    display: flex;
    justify-content: center;
    padding: 40px 24px;
    min-height: 100vh;
  }

  .table {
    width: 100%;
    max-width: 820px;
    border: 22px solid var(--rail);
    border-radius: 28px;
    background:
      repeating-linear-gradient(45deg, rgba(0,0,0,0.03) 0 2px, transparent 2px 4px),
      linear-gradient(180deg, var(--baize) 0%, var(--baize-dark) 100%);
    box-shadow:
      inset 0 0 0 3px var(--rail-light),
      inset 0 0 60px rgba(0,0,0,0.45),
      0 20px 50px rgba(0,0,0,0.5);
    padding: 40px 36px 48px;
    position: relative;
    align-self: flex-start;
  }

  .pocket {
    position: absolute;
    width: 34px; height: 34px;
    background: #000;
    border-radius: 50%;
    box-shadow: 0 0 0 4px var(--rail-light);
  }
  .p1 { top: -28px; left: -28px; }
  .p2 { top: -28px; right: -28px; }
  .p3 { bottom: -28px; left: -28px; }
  .p4 { bottom: -28px; right: -28px; }

  .back {
    display: inline-block;
    color: var(--brass);
    font-weight: 600;
    text-decoration: none;
    margin-bottom: 20px;
  }
  .back:hover { text-decoration: underline; }
  .back:focus-visible { outline: 3px solid var(--chalk); outline-offset: 3px; border-radius: 4px; }

  h1 {
    font-family: "Alfa Slab One", Georgia, serif;
    font-weight: 400;
    font-size: clamp(2rem, 6vw, 3rem);
    line-height: 1.05;
    text-shadow: 0 3px 0 rgba(0,0,0,0.35);
    margin-bottom: 24px;
  }

  h2 {
    font-family: "Alfa Slab One", Georgia, serif;
    font-weight: 400;
    font-size: 1.35rem;
    margin-bottom: 6px;
  }
  .hint { opacity: 0.8; margin-bottom: 14px; font-size: 0.98rem; }

  section { margin-top: 32px; }

  /* Player picker */
  .picker { max-width: 360px; }
  .picker label {
    display: block;
    font-weight: 600;
    font-size: 0.95rem;
    color: var(--brass);
    padding-left: 14px;
    margin-bottom: 6px;
  }
  select {
    width: 100%;
    font: inherit;
    font-size: 1.1rem;
    padding: 13px 44px 13px 20px;
    border-radius: 999px;
    border: 2px solid transparent;
    color: var(--ivory);
    color-scheme: dark;
    appearance: none;
    cursor: pointer;
    background-color: rgba(0,0,0,0.25);
    background-image:
      linear-gradient(45deg, transparent 50%, var(--ivory) 50%),
      linear-gradient(135deg, var(--ivory) 50%, transparent 50%);
    background-position: calc(100% - 24px) 52%, calc(100% - 18px) 52%;
    background-size: 6px 6px;
    background-repeat: no-repeat;
  }
  select:focus { outline: none; border-color: var(--chalk); }
  select option { background: var(--baize-dark); color: var(--ivory); }

  /* Headline stats */
  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-top: 28px;
  }
  .stat {
    background: rgba(0,0,0,0.22);
    border-radius: 20px;
    padding: 14px 16px;
  }
  .stat-value {
    font-family: "Alfa Slab One", Georgia, serif;
    font-size: 1.8rem;
    line-height: 1.1;
  }
  .stat-label { opacity: 0.8; font-size: 0.95rem; }

  /* Form strip */
  .form {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  .form .latest {
    font-size: 0.9rem;
    opacity: 0.75;
    margin-right: 4px;
  }
  .wl {
    width: 38px; height: 38px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-weight: 700;
    font-size: 1.05rem;
    flex: none;
  }
  .wl.w { background: var(--brass); color: #1d1d1d; }
  .wl.l { background: rgba(245,240,225,0.15); color: var(--ivory); border: 2px solid rgba(245,240,225,0.3); }

  /* Leg exposure chart */
  .legs-chart {
    display: grid;
    grid-template-columns: repeat(13, minmax(0, 1fr));
    gap: 6px;
    align-items: end;
    height: 170px;
    padding: 0 2px;
  }
  .leg-col {
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    gap: 4px;
  }
  .leg-count { font-weight: 700; font-size: 0.95rem; }
  .leg-bar {
    width: 100%;
    max-width: 34px;
    border-radius: 8px 8px 3px 3px;
    background: rgba(245,240,225,0.18);
    position: relative;
    overflow: hidden;
    min-height: 3px;
  }
  .leg-bar .won {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    background: var(--brass);
  }
  .leg-numbers {
    display: grid;
    grid-template-columns: repeat(13, minmax(0, 1fr));
    gap: 6px;
    margin-top: 6px;
    padding: 6px 2px 0;
    border-top: 2px solid rgba(245,240,225,0.25);
    text-align: center;
    font-size: 0.9rem;
    opacity: 0.85;
  }
  .key {
    display: flex;
    gap: 18px;
    margin-top: 12px;
    font-size: 0.95rem;
    opacity: 0.85;
  }
  .key span::before {
    content: "";
    display: inline-block;
    width: 12px; height: 12px;
    border-radius: 3px;
    margin-right: 6px;
    vertical-align: -1px;
  }
  .key .k-won::before { background: var(--brass); }
  .key .k-lost::before { background: rgba(245,240,225,0.18); }

  /* Match history */
  .history { list-style: none; display: grid; gap: 10px; }
  .match {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 6px 16px;
    align-items: center;
    background: rgba(0,0,0,0.22);
    border-radius: 20px;
    padding: 14px 18px;
  }
  .match-date { color: var(--brass); font-weight: 600; font-size: 0.95rem; }
  .match-teams { font-weight: 700; font-size: 1.1rem; overflow-wrap: anywhere; }
  .match-teams .v { opacity: 0.6; font-weight: 400; margin: 0 6px; }
  .match-legs {
    grid-column: 1 / -1;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .leg-tag {
    font-size: 0.92rem;
    font-weight: 600;
    border-radius: 999px;
    padding: 3px 12px;
  }
  .leg-tag.w { background: var(--brass); color: #1d1d1d; }
  .leg-tag.l { background: rgba(245,240,225,0.15); }
  .match-record {
    font-family: "Alfa Slab One", Georgia, serif;
    font-size: 1rem;
    white-space: nowrap;
    grid-row: 1 / span 2;
    grid-column: 2;
  }

  .message {
    text-align: center;
    padding: 28px 16px;
    opacity: 0.85;
    font-size: 1.05rem;
    line-height: 1.5;
  }
  .error {
    background: rgba(210,43,43,0.25);
    border: 2px solid var(--red);
    border-radius: 16px;
    padding: 14px 18px;
    margin-top: 20px;
    display: none;
  }
  .error.show { display: block; }

  @media (max-width: 600px) {
    .table { border-width: 14px; padding: 32px 16px 40px; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .legs-chart, .leg-numbers { gap: 3px; }
    .leg-count { font-size: 0.8rem; }
    .leg-numbers { font-size: 0.8rem; }
    .wl { width: 32px; height: 32px; font-size: 0.95rem; }
    .pocket { width: 26px; height: 26px; }
    .p1, .p3 { left: -21px; }
    .p2, .p4 { right: -21px; }
    .p1, .p2 { top: -21px; }
    .p3, .p4 { bottom: -21px; }
  }
</style>
</head>
<body>

<main class="table">
  <div class="pocket p1"></div><div class="pocket p2"></div>
  <div class="pocket p3"></div><div class="pocket p4"></div>

  <a class="back" href="index.html">‹ Back to home</a>
  <h1>Player Insights</h1>

  <div class="picker">
    <label for="playerSelect">Player</label>
    <select id="playerSelect" disabled>
      <option value="">Loading players…</option>
    </select>
  </div>

  <div class="error" id="error" role="alert"></div>

  <div id="output" aria-live="polite"></div>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getFirestore, collection, onSnapshot
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // ── Firebase config ────────────────────────────────────────────
  // Use the same values you put in team.html
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "stapleford-pool-monday-team.firebaseapp.com",
    projectId: "stapleford-pool-monday-team",
    storageBucket: "stapleford-pool-monday-team.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  const PLAYERS_COLLECTION = "players";
  const RESULTS_COLLECTION = "results";
  const NUMBER_OF_LEGS = 13;
  const FORM_LENGTH = 10; // how many recent legs to show in the form strip
  // ───────────────────────────────────────────────────────────────

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const selectEl = document.getElementById("playerSelect");
  const outputEl = document.getElementById("output");
  const errorEl = document.getElementById("error");

  let players = [];
  let results = [];
  let resultsLoaded = false;

  // Keep the chosen player in the address so a refresh shows the same player
  let selectedId = new URLSearchParams(location.search).get("player") || "";

  function showError(msg) { errorEl.textContent = msg; errorEl.classList.add("show"); }
  function clearError() { errorEl.classList.remove("show"); }

  function el(tag, className, text) {
    const e = document.createElement(tag);
    if (className) e.className = className;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function formatDate(iso) {
    if (!iso) return "No date";
    const d = new Date(iso + "T12:00:00");
    return isNaN(d) ? iso : d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short", year: "numeric" });
  }

  function fillSelect() {
    selectEl.innerHTML = "";
    selectEl.appendChild(new Option(players.length ? "Choose a player" : "No players on the team yet", ""));
    players.forEach(p => selectEl.appendChild(new Option(p.name, p.id)));
    selectEl.disabled = players.length === 0;
    if (players.some(p => p.id === selectedId)) selectEl.value = selectedId;
    else selectedId = "";
  }

  function render() {
    outputEl.innerHTML = "";
    if (!selectedId) {
      if (players.length) outputEl.appendChild(el("p", "message", "Choose a player to see their history, form and leg exposure."));
      return;
    }
    if (!resultsLoaded) {
      outputEl.appendChild(el("p", "message", "Loading results…"));
      return;
    }

    // Newest match first (date, then when it was entered)
    const sorted = [...results].sort((a, b) =>
      (b.date || "").localeCompare(a.date || "") ||
      ((b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0))
    );

    // Gather this player's legs, match by match
    const matches = [];
    sorted.forEach(r => {
      const legs = (Array.isArray(r.legs) ? r.legs : [])
        .map((leg, i) => ({ ...leg, number: leg.leg || i + 1 }))
        .filter(leg => leg.playerId === selectedId && (leg.won === true || leg.won === false));
      if (legs.length) matches.push({ ...r, playerLegs: legs });
    });

    if (matches.length === 0) {
      outputEl.appendChild(el("p", "message", "This player hasn't played in any saved results yet."));
      return;
    }

    // Every leg in order, newest first (later legs in a match count as more recent)
    const allLegs = matches.flatMap(m => [...m.playerLegs].sort((a, b) => b.number - a.number));
    const played = allLegs.length;
    const won = allLegs.filter(l => l.won).length;
    const pct = (Math.round((won / played) * 1000) / 10).toFixed(1) + "%";

    // Headline stats
    const stats = el("div", "stats");
    [[played, "Played"], [won, "Won"], [played - won, "Lost"], [pct, "Win %"]].forEach(([v, label]) => {
      const s = el("div", "stat");
      s.append(el("div", "stat-value", String(v)), el("div", "stat-label", label));
      stats.appendChild(s);
    });
    outputEl.appendChild(stats);

    // Form strip
    const formSec = el("section");
    formSec.appendChild(el("h2", "", "Form"));
    formSec.appendChild(el("p", "hint", `Last ${Math.min(FORM_LENGTH, played)} legs, most recent on the left.`));
    const form = el("div", "form");
    allLegs.slice(0, FORM_LENGTH).forEach(l => {
      const dot = el("span", "wl " + (l.won ? "w" : "l"), l.won ? "W" : "L");
      dot.title = l.won ? "Won" : "Lost";
      form.appendChild(dot);
    });
    form.setAttribute("aria-label", "Form, most recent first: " + allLegs.slice(0, FORM_LENGTH).map(l => l.won ? "Won" : "Lost").join(", "));
    formSec.appendChild(form);
    outputEl.appendChild(formSec);

    // Leg exposure
    const exposure = Array.from({ length: NUMBER_OF_LEGS }, () => ({ played: 0, won: 0 }));
    allLegs.forEach(l => {
      const idx = l.number - 1;
      if (idx >= 0 && idx < NUMBER_OF_LEGS) {
        exposure[idx].played++;
        if (l.won) exposure[idx].won++;
      }
    });
    const maxPlayed = Math.max(1, ...exposure.map(e => e.played));

    const expSec = el("section");
    expSec.appendChild(el("h2", "", "Leg exposure"));
    expSec.appendChild(el("p", "hint", "How often they've played each of the 13 legs, and how many of those they won."));
    const chart = el("div", "legs-chart");
    exposure.forEach((e, i) => {
      const col = el("div", "leg-col");
      col.appendChild(el("span", "leg-count", e.played ? String(e.played) : ""));
      const bar = el("div", "leg-bar");
      bar.style.height = (e.played / maxPlayed * 100) + "%";
      if (e.played) {
        const fill = el("div", "won");
        fill.style.height = (e.won / e.played * 100) + "%";
        bar.appendChild(fill);
      }
      bar.title = `Leg ${i + 1}: played ${e.played}, won ${e.won}`;
      col.setAttribute("aria-label", `Leg ${i + 1}: played ${e.played}, won ${e.won}`);
      col.setAttribute("role", "img");
      col.appendChild(bar);
      chart.appendChild(col);
    });
    expSec.appendChild(chart);
    const nums = el("div", "leg-numbers");
    nums.setAttribute("aria-hidden", "true");
    for (let i = 1; i <= NUMBER_OF_LEGS; i++) nums.appendChild(el("span", "", String(i)));
    expSec.appendChild(nums);
    const key = el("div", "key");
    key.append(el("span", "k-won", "Won"), el("span", "k-lost", "Lost"));
    expSec.appendChild(key);
    outputEl.appendChild(expSec);

    // Match history
    const histSec = el("section");
    histSec.appendChild(el("h2", "", "Win / loss history"));
    histSec.appendChild(el("p", "hint", "Newest match first."));
    const list = el("ul", "history");
    matches.forEach(m => {
      const li = el("li", "match");
      const info = el("div");
      info.appendChild(el("div", "match-date", formatDate(m.date)));
      const teams = el("div", "match-teams");
      teams.append(m.homeTeam || "Home", el("span", "v", "v"), m.awayTeam || "Away");
      info.appendChild(teams);

      const mWon = m.playerLegs.filter(l => l.won).length;
      const mLost = m.playerLegs.length - mWon;
      const record = el("div", "match-record", `${mWon}W ${mLost}L`);

      const legsWrap = el("div", "match-legs");
      [...m.playerLegs].sort((a, b) => a.number - b.number).forEach(l => {
        legsWrap.appendChild(el("span", "leg-tag " + (l.won ? "w" : "l"), `Leg ${l.number} · ${l.won ? "Won" : "Lost"}`));
      });

      li.append(info, record, legsWrap);
      list.appendChild(li);
    });
    histSec.appendChild(list);
    outputEl.appendChild(histSec);
  }

  selectEl.addEventListener("change", () => {
    selectedId = selectEl.value;
    const url = new URL(location.href);
    if (selectedId) url.searchParams.set("player", selectedId);
    else url.searchParams.delete("player");
    history.replaceState(null, "", url);
    render();
  });

  onSnapshot(
    collection(db, PLAYERS_COLLECTION),
    (snap) => {
      clearError();
      players = snap.docs
        .map(d => ({ id: d.id, name: d.data().name || d.id }))
        .sort((a, b) => a.name.localeCompare(b.name, "en-GB", { sensitivity: "base" }));
      fillSelect();
      render();
    },
    (err) => {
      console.error(err);
      selectEl.innerHTML = '<option value="">Couldn\'t load players</option>';
      showError("Couldn't connect to Firebase. Check the config values in insights.html and your Firestore rules.");
    }
  );

  onSnapshot(
    collection(db, RESULTS_COLLECTION),
    (snap) => {
      results = snap.docs.map(d => d.data());
      resultsLoaded = true;
      render();
    },
    (err) => {
      console.error(err);
      showError("Couldn't load results. Check your Firestore rules allow reading the results collection.");
    }
  );
</script>

</body>
</html>
