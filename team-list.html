<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team List - Stapleford Cue Stars Pool Team</title>
<style>
  :root{
    --felt: #0f4d3a;
    --felt-dark: #0a3a2b;
    --rail: #4a2c1d;
    --rail-dark: #331f14;
    --ivory: #f3ede0;
    --gold: #c9a227;
    --line: rgba(243,237,224,0.16);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 20% 10%, rgba(255,255,255,0.04), transparent 40%),
      var(--felt);
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px),
      var(--felt);
    font-family: 'Segoe UI', -apple-system, system-ui, sans-serif;
    color: var(--ivory);
    padding-bottom: 60px;
  }
  .rail{
    background: linear-gradient(180deg, var(--rail) 0%, var(--rail-dark) 100%);
    border-bottom: 4.5px solid var(--gold);
    padding: 24px 15px 20px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.35);
  }
  .rail-inner{
    max-width: 720px;
    margin: 0 auto;
  }
  .back-link{
    color: var(--gold);
    font-size: 12px;
    text-decoration: none;
    letter-spacing: 0.5px;
    font-weight: 600;
  }
  h1{
    font-family: 'Oswald', 'Arial Narrow', sans-serif;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-size: clamp(21px, 4.5vw, 33px);
    margin: 4px 0 0;
    color: var(--ivory);
    text-shadow: 0 2px 0 rgba(0,0,0,0.3);
  }

  main{
    max-width: 720px;
    margin: 0 auto;
    padding: 24px 15px 0;
  }

  .status-line{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:11px;
    color: rgba(243,237,224,0.65);
    margin-bottom: 14px;
    letter-spacing: 0.3px;
  }
  .dot{ width:7px;height:7px;border-radius:50%; background: var(--gold); }

  .roster{
    background: rgba(0,0,0,0.18);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }
  .player-row{
    display:flex;
    align-items:center;
    gap: 14px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
  }
  .player-row:last-child{ border-bottom:none; }

  .ball{
    position: relative;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    flex-shrink: 0;
    box-shadow: inset -4px -4px 8px rgba(0,0,0,0.35), inset 3px 3px 5px rgba(255,255,255,0.25), 0 2px 4px rgba(0,0,0,0.4);
  }
  .ball .num{
    position:absolute; top:50%; left:50%; transform: translate(-50%,-50%);
    width: 18px; height:18px; border-radius:50%;
    background: var(--ivory);
    display:flex; align-items:center; justify-content:center;
    font-size: 9px; font-weight: 800; font-family: Georgia, serif;
    box-shadow: 0 1px 2px rgba(0,0,0,0.3);
  }

  .name-field{ flex: 1; min-width: 0; }
  .name-text{ font-size: 14px; font-weight: 600; color: var(--ivory); word-break: break-word; }
  .name-input{
    width: 100%;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--line);
    color: var(--ivory);
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 14px;
    font-family: inherit;
  }
  .name-input:focus{ outline: none; border-color: var(--gold); }

  .player-check{
    width: 18px; height: 18px; flex-shrink: 0;
    accent-color: #d9534f; cursor: pointer;
  }

  .star-rating{
    display: flex;
    gap: 2px;
    flex-shrink: 0;
  }
  .star-rating .star{
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    color: rgba(243,237,224,0.25);
    transition: color 0.1s ease;
    user-select: none;
  }
  .star-rating .star.filled{ color: var(--gold); }
  .star-rating .star:hover{ color: var(--gold); }

  .tier-label{
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    padding: 4px 9px;
    border-radius: 4px;
    flex-shrink: 0;
    white-space: nowrap;
  }
  .tier-label.exclude{ background: rgba(217,83,79,0.18); color: #ff8a80; }
  .tier-label.tier3{ background: rgba(243,237,224,0.1); color: rgba(243,237,224,0.7); }
  .tier-label.tier2{ background: rgba(76,111,165,0.2); color: #8fb4e8; }
  .tier-label.tier1{ background: rgba(143,209,158,0.18); color: #8fd19e; }

  .empty-state{ padding: 40px 24px; text-align: center; color: rgba(243,237,224,0.6); }
  .empty-state .tri{ font-size: 30px; margin-bottom: 8px; }
  .empty-state p{ margin: 4px 0; font-size: 13px; }

  .add-bar{ display:flex; gap: 10px; margin-top: 16px; }
  .add-bar input{
    flex:1;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--line);
    color: var(--ivory);
    padding: 11px 13px;
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
  }
  .add-bar input:focus{ outline:none; border-color: var(--gold); }
  .add-bar button{
    background: var(--gold);
    color: var(--rail-dark);
    border: none;
    padding: 0 20px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.4px;
    cursor: pointer;
  }
  .add-bar button:hover{ filter: brightness(1.08); }

  .delete-bar{ display:flex; justify-content: flex-end; margin-top: 12px; }
  .delete-bar button{
    background: #d9534f;
    color: var(--ivory);
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.4px;
    cursor: pointer;
  }
  .delete-bar button:hover:not(:disabled){ filter: brightness(1.1); }
  .delete-bar button:disabled{ opacity: 0.4; cursor: not-allowed; }

  .footnote{ margin-top: 14px; font-size: 11px; color: rgba(243,237,224,0.45); text-align:center; }

  .hidden{ display:none !important; }

  /* Modal */
  .overlay{
    position: fixed; inset:0;
    background: rgba(0,0,0,0.55);
    display:none;
    align-items:center; justify-content:center;
    padding: 20px;
    z-index: 50;
  }
  .overlay.show{ display:flex; }
  .modal{
    background: var(--rail);
    border: 1px solid var(--gold);
    border-radius: 10px;
    padding: 26px;
    max-width: 300px;
    width: 100%;
    text-align:center;
  }
  .modal h2{
    margin: 0 0 6px;
    font-family: 'Oswald', sans-serif;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-size: 18px;
    color: var(--ivory);
  }
  .modal p{ font-size: 12px; color: rgba(243,237,224,0.65); margin: 0 0 14px; }
  .modal-actions{ display:flex; gap: 10px; margin-top: 6px; }
  .modal-actions button{
    flex:1; padding: 10px; border-radius: 6px; border: none;
    font-weight: 700; cursor: pointer; font-size: 13px;
  }
  .modal-actions .confirm{ background: var(--gold); color: var(--rail-dark); }
  .modal-actions .cancel{ background: transparent; color: var(--ivory); border: 1px solid var(--line); }
</style>
</head>
<body>

<div class="rail">
  <div class="rail-inner">
    <a class="back-link" href="index.html">&larr; Home</a>
    <h1>The Cue Stars Team</h1>
  </div>
</div>

<main>
  <div class="status-line"><span class="dot"></span><span id="statusText">Loading team list…</span></div>

  <div class="roster hidden" id="roster"></div>
  <div class="empty-state hidden" id="emptyState">
    <div class="tri">▲</div>
    <p><strong>The list is empty.</strong></p>
    <p id="emptySub">Log in as admin on the home page to add players.</p>
  </div>

  <div class="add-bar hidden" id="addBar">
    <input type="text" id="newPlayerName" placeholder="Player name" maxlength="60">
    <button id="addBtn">Add</button>
  </div>

  <div class="delete-bar hidden" id="deleteBar">
    <button id="deleteSelectedBtn" disabled>Delete</button>
  </div>

  <div class="footnote" id="footnoteText">Anyone can view this list. Only a signed-in admin can add, rename, or remove players.</div>
</main>

<div class="overlay" id="confirmOverlay">
  <div class="modal">
    <h2>Remove Players?</h2>
    <p id="confirmMessage"></p>
    <div class="modal-actions">
      <button class="cancel" id="confirmCancel">Cancel</button>
      <button class="confirm" id="confirmDelete" style="background:#d9534f; color:var(--ivory);">Delete</button>
    </div>
  </div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAiIaXtQRBvDGFllrzmjYbx_Br1mR65Ox8",
    authDomain: "stapleford-cue-stars.firebaseapp.com",
    projectId: "stapleford-cue-stars",
    storageBucket: "stapleford-cue-stars.firebasestorage.app",
    messagingSenderId: "488893378210",
    appId: "1:488893378210:web:9f81ed4b389443081031fb"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();
  const playersRef = db.collection('players').orderBy('name', 'asc');

  let players = [];
  let isAdmin = false;
  let selectedIds = new Set();

  const BALL_COLORS = ['#c9a227','#2b5fa5','#b5261f','#5c2d91','#d9691a','#1e6b3c','#7a1f2b','#1c1b19'];

  const rosterEl = document.getElementById('roster');
  const emptyStateEl = document.getElementById('emptyState');
  const emptySub = document.getElementById('emptySub');
  const addBar = document.getElementById('addBar');
  const deleteBar = document.getElementById('deleteBar');
  const deleteSelectedBtn = document.getElementById('deleteSelectedBtn');
  const statusText = document.getElementById('statusText');
  const footnoteText = document.getElementById('footnoteText');
  const newPlayerName = document.getElementById('newPlayerName');
  const addBtn = document.getElementById('addBtn');
  const confirmOverlay = document.getElementById('confirmOverlay');
  const confirmMessage = document.getElementById('confirmMessage');
  const confirmCancel = document.getElementById('confirmCancel');
  const confirmDelete = document.getElementById('confirmDelete');

  function ballStyle(index){
    const num = index + 1;
    const color = BALL_COLORS[index % BALL_COLORS.length];
    const isStripe = num > 8;
    if(isStripe){
      return `background: linear-gradient(to bottom, #f3ede0 0%, #f3ede0 28%, ${color} 28%, ${color} 72%, #f3ede0 72%, #f3ede0 100%);`;
    }
    return `background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.5), ${color} 60%);`;
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }
  function escapeAttr(str){
    return String(str).replace(/"/g, '&quot;');
  }

  function renderStarRating(id, rating){
    let stars = '';
    for(let i = 1; i <= 5; i++){
      stars += `<span class="star ${i <= rating ? 'filled' : ''}" data-id="${id}" data-value="${i}">★</span>`;
    }
    return `<div class="star-rating">${stars}</div>`;
  }

  function tierLabel(rating){
    if(rating === 0) return { text: 'Exclude', cls: 'exclude' };
    if(rating >= 1 && rating <= 3) return { text: 'Tier 3', cls: 'tier3' };
    if(rating === 4) return { text: 'Tier 2', cls: 'tier2' };
    return { text: 'Tier 1', cls: 'tier1' };
  }

  function render(){
    if(players.length === 0){
      rosterEl.classList.add('hidden');
      emptyStateEl.classList.remove('hidden');
      emptySub.textContent = isAdmin ? 'Add your first player below.' : 'Log in as admin on the home page to add players.';
    } else {
      emptyStateEl.classList.add('hidden');
      rosterEl.classList.remove('hidden');
      const sortedPlayers = [...players].sort((a, b) => {
        const aIsNoPlayer = a.name.trim().toLowerCase() === 'no player';
        const bIsNoPlayer = b.name.trim().toLowerCase() === 'no player';
        if(aIsNoPlayer && !bIsNoPlayer) return 1;
        if(!aIsNoPlayer && bIsNoPlayer) return -1;
        return a.name.localeCompare(b.name);
      });
      rosterEl.innerHTML = sortedPlayers.map((p, i) => `
        <div class="player-row" data-id="${p.id}">
          <div class="ball" style="${ballStyle(i)}"><span class="num">${i+1}</span></div>
          <div class="name-field">
            ${isAdmin
              ? `<input class="name-input" data-id="${p.id}" value="${escapeAttr(p.name)}" maxlength="60">`
              : `<div class="name-text">${escapeHtml(p.name)}</div>`}
          </div>
          ${isAdmin ? renderStarRating(p.id, p.rating) : ''}
          ${isAdmin ? `<span class="tier-label ${tierLabel(p.rating).cls}">${tierLabel(p.rating).text}</span>` : ''}
          ${isAdmin ? `<input type="checkbox" class="player-check" data-id="${p.id}" ${selectedIds.has(p.id) ? 'checked' : ''} title="Select for deletion">` : ''}
        </div>
      `).join('');
    }
    addBar.classList.toggle('hidden', !isAdmin);
    deleteBar.classList.toggle('hidden', !isAdmin || players.length === 0);
    deleteSelectedBtn.disabled = selectedIds.size === 0;
    deleteSelectedBtn.textContent = selectedIds.size > 0 ? `Delete (${selectedIds.size})` : 'Delete';
    statusText.textContent = `${players.length} player${players.length === 1 ? '' : 's'} on the list${isAdmin ? ' · editing enabled (admin)' : ' · view only'}`;
    footnoteText.textContent = isAdmin
      ? 'You are signed in as admin — you can add, rename, and remove players.'
      : 'Anyone can view this list. Only a signed-in admin can add, rename, or remove players.';
  }

  function docToPlayer(doc){
    return { id: doc.id, name: doc.data().name, rating: doc.data().rating || 0, createdAt: doc.data().createdAt };
  }

  playersRef.onSnapshot((snapshot) => {
    players = snapshot.docs.map(docToPlayer);
    render();
  }, (error) => {
    statusText.textContent = 'Could not load team list — check Firestore rules/config.';
  });

  auth.onAuthStateChanged((user) => {
    isAdmin = !!user;
    selectedIds.clear();
    render();
  });

  async function addPlayerDoc(name){
    try{
      await db.collection('players').add({ name, createdAt: Date.now() });
    } catch(e){
      statusText.textContent = 'Could not save — make sure you are signed in as admin.';
    }
  }
  async function updatePlayerDoc(id, name){
    try{
      await db.collection('players').doc(id).update({ name });
    } catch(e){
      statusText.textContent = 'Could not save changes — please try again.';
    }
  }
  async function updatePlayerRating(id, rating){
    try{
      await db.collection('players').doc(id).update({
        rating,
        tier: tierLabel(rating).text
      });
    } catch(e){
      statusText.textContent = 'Could not save rating — please try again.';
    }
  }
  async function deletePlayerDocs(ids){
    try{
      const batch = db.batch();
      ids.forEach(id => batch.delete(db.collection('players').doc(id)));
      await batch.commit();
    } catch(e){
      statusText.textContent = 'Could not delete — please try again.';
    }
  }

  async function addPlayer(){
    const name = newPlayerName.value.trim();
    if(!name) return;
    newPlayerName.value = '';
    await addPlayerDoc(name);
  }
  addBtn.addEventListener('click', addPlayer);
  newPlayerName.addEventListener('keydown', (e) => { if(e.key === 'Enter') addPlayer(); });

  rosterEl.addEventListener('change', async (e) => {
    if(e.target.matches('.name-input')){
      const id = e.target.dataset.id;
      const val = e.target.value.trim();
      if(val){ await updatePlayerDoc(id, val); }
    }
    if(e.target.matches('.player-check')){
      const id = e.target.dataset.id;
      if(e.target.checked){ selectedIds.add(id); } else { selectedIds.delete(id); }
      deleteSelectedBtn.disabled = selectedIds.size === 0;
      deleteSelectedBtn.textContent = selectedIds.size > 0 ? `Delete (${selectedIds.size})` : 'Delete';
    }
  });

  rosterEl.addEventListener('click', async (e) => {
    if(e.target.matches('.star')){
      const id = e.target.dataset.id;
      const value = Number(e.target.dataset.value);
      const player = players.find(p => p.id === id);
      const newRating = (player && player.rating === value) ? 0 : value;
      await updatePlayerRating(id, newRating);
    }
  });

  deleteSelectedBtn.addEventListener('click', () => {
    if(selectedIds.size === 0) return;
    const names = players.filter(p => selectedIds.has(p.id)).map(p => p.name).join(', ');
    confirmMessage.textContent = `Remove ${selectedIds.size} player${selectedIds.size === 1 ? '' : 's'} (${names}) from the list?`;
    confirmOverlay.classList.add('show');
  });
  confirmCancel.addEventListener('click', () => confirmOverlay.classList.remove('show'));
  confirmDelete.addEventListener('click', async () => {
    const idsToDelete = Array.from(selectedIds);
    selectedIds.clear();
    confirmOverlay.classList.remove('show');
    await deletePlayerDocs(idsToDelete);
  });
</script>
</body>
</html>
