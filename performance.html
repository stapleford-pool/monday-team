<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player Performance · Stapleford Monday Night Pool Team</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --baize: #0f5a3c;
    --baize-dark: #08402a;
    --rail: #5a2e1b;
    --rail-light: #7a4127;
    --brass: #d4a94f;
    --chalk: #6fa8dc;
    --ivory: #f5f0e1;
    --red: #d22b2b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Barlow", "Helvetica Neue", Arial, sans-serif;
    color: var(--ivory);
    background:
      radial-gradient(ellipse at 50% 30%, rgba(255,255,255,0.10), transparent 60%),
      var(--baize);
    display: flex;
    justify-content: center;
    padding: 40px 24px;
    min-height: 100vh;
  }

  .table {
    width: 100%;
    max-width: 820px;
    border: 22px solid var(--rail);
    border-radius: 28px;
    background:
      repeating-linear-gradient(45deg, rgba(0,0,0,0.03) 0 2px, transparent 2px 4px),
      linear-gradient(180deg, var(--baize) 0%, var(--baize-dark) 100%);
    box-shadow:
      inset 0 0 0 3px var(--rail-light),
      inset 0 0 60px rgba(0,0,0,0.45),
      0 20px 50px rgba(0,0,0,0.5);
    padding: 40px 36px 48px;
    position: relative;
    align-self: flex-start;
  }

  .pocket {
    position: absolute;
    width: 34px; height: 34px;
    background: #000;
    border-radius: 50%;
    box-shadow: 0 0 0 4px var(--rail-light);
  }
  .p1 { top: -28px; left: -28px; }
  .p2 { top: -28px; right: -28px; }
  .p3 { bottom: -28px; left: -28px; }
  .p4 { bottom: -28px; right: -28px; }

  .back {
    display: inline-block;
    color: var(--brass);
    font-weight: 600;
    text-decoration: none;
    margin-bottom: 20px;
  }
  .back:hover { text-decoration: underline; }
  .back:focus-visible { outline: 3px solid var(--chalk); outline-offset: 3px; border-radius: 4px; }

  h1 {
    font-family: "Alfa Slab One", Georgia, serif;
    font-weight: 400;
    font-size: clamp(2rem, 6vw, 3rem);
    line-height: 1.05;
    text-shadow: 0 3px 0 rgba(0,0,0,0.35);
    margin-bottom: 8px;
  }

  .count {
    opacity: 0.8;
    margin-bottom: 24px;
    font-size: 1.05rem;
  }

  /* Filters */
  .filters {
    display: grid;
    grid-template-columns: 1fr 1fr auto;
    gap: 14px;
    align-items: end;
    background: rgba(0,0,0,0.18);
    border-radius: 24px;
    padding: 16px;
    margin-bottom: 24px;
  }

  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label {
    font-weight: 600;
    font-size: 0.95rem;
    color: var(--brass);
    padding-left: 14px;
  }
  .field input {
    width: 100%;
    font: inherit;
    font-size: 1.05rem;
    padding: 11px 18px;
    border-radius: 999px;
    border: 2px solid transparent;
    background: rgba(0,0,0,0.25);
    color: var(--ivory);
    color-scheme: dark;
  }
  .field input:focus { outline: none; border-color: var(--chalk); }

  .clear {
    font: inherit;
    font-weight: 600;
    font-size: 0.95rem;
    background: transparent;
    color: var(--ivory);
    border: 2px solid rgba(245,240,225,0.35);
    border-radius: 999px;
    padding: 11px 18px;
    cursor: pointer;
    white-space: nowrap;
  }
  .clear:hover { border-color: var(--ivory); }
  .clear:focus-visible { outline: 3px solid var(--chalk); outline-offset: 3px; }

  /* Stats table */
  .scroll { overflow-x: auto; }

  .stats {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0 8px;
    font-size: 1.1rem;
  }
  .stats th {
    text-align: right;
    font-weight: 600;
    font-size: 0.95rem;
    color: var(--brass);
    padding: 0 16px 2px;
    white-space: nowrap;
  }
  .stats th:first-child { text-align: left; padding-left: 24px; }

  .stats td {
    background: rgba(0,0,0,0.22);
    padding: 12px 16px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .stats td:first-child {
    text-align: left;
    font-weight: 600;
    border-radius: 999px 0 0 999px;
    padding-left: 24px;
    overflow-wrap: anywhere;
  }
  .stats td:last-child { border-radius: 0 999px 999px 0; padding-right: 20px; }

  .pct {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 12px;
    font-weight: 700;
  }
  .bar {
    width: 80px;
    height: 8px;
    border-radius: 999px;
    background: rgba(245,240,225,0.15);
    overflow: hidden;
    flex: none;
  }
  .bar span { display: block; height: 100%; background: var(--brass); border-radius: 999px; }
  .pct-value { min-width: 3.6rem; }

  .message {
    text-align: center;
    padding: 28px 16px;
    opacity: 0.85;
    font-size: 1.05rem;
    line-height: 1.5;
  }
  .error {
    background: rgba(210,43,43,0.25);
    border: 2px solid var(--red);
    border-radius: 16px;
    padding: 14px 18px;
    margin-bottom: 20px;
    display: none;
  }
  .error.show { display: block; }

  @media (max-width: 600px) {
    .table { border-width: 14px; padding: 32px 16px 40px; }
    .filters { grid-template-columns: 1fr 1fr; }
    .clear { grid-column: 1 / -1; }
    .stats { font-size: 1rem; }
    .stats th, .stats td { padding-left: 10px; padding-right: 10px; }
    .stats th:first-child, .stats td:first-child { padding-left: 16px; }
    .bar { display: none; }
    .pocket { width: 26px; height: 26px; }
    .p1, .p3 { left: -21px; }
    .p2, .p4 { right: -21px; }
    .p1, .p2 { top: -21px; }
    .p3, .p4 { bottom: -21px; }
  }
</style>
</head>
<body>

<main class="table">
  <div class="pocket p1"></div><div class="pocket p2"></div>
  <div class="pocket p3"></div><div class="pocket p4"></div>

  <a class="back" href="index.html">‹ Back to home</a>
  <h1>Player Performance</h1>
  <p class="count" id="count">Loading results…</p>

  <div class="filters">
    <div class="field">
      <label for="minPlayed">Minimum played</label>
      <input id="minPlayed" type="number" min="0" step="1" value="0" inputmode="numeric">
    </div>
    <div class="field">
      <label for="fromDate">Results from</label>
      <input id="fromDate" type="date">
    </div>
    <button class="clear" type="button" id="clearBtn">Clear filters</button>
  </div>

  <div class="error" id="error" role="alert"></div>

  <div class="scroll" id="output" aria-live="polite"></div>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getFirestore, collection, onSnapshot
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // ── Firebase config ────────────────────────────────────────────
  // Use the same values you put in team.html
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "stapleford-pool-monday-team.firebaseapp.com",
    projectId: "stapleford-pool-monday-team",
    storageBucket: "stapleford-pool-monday-team.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  const PLAYERS_COLLECTION = "players";
  const RESULTS_COLLECTION = "results";
  // ───────────────────────────────────────────────────────────────

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const outputEl = document.getElementById("output");
  const countEl = document.getElementById("count");
  const errorEl = document.getElementById("error");
  const minInput = document.getElementById("minPlayed");
  const fromInput = document.getElementById("fromDate");
  const clearBtn = document.getElementById("clearBtn");

  let results = [];
  let playerNames = {};   // id -> current name from the team list
  let resultsLoaded = false;

  function showError(msg) { errorEl.textContent = msg; errorEl.classList.add("show"); }
  function clearError() { errorEl.classList.remove("show"); }

  function el(tag, className, text) {
    const e = document.createElement(tag);
    if (className) e.className = className;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function formatDate(iso) {
    const d = new Date(iso + "T12:00:00");
    return isNaN(d) ? iso : d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
  }

  function render() {
    if (!resultsLoaded) return;

    const fromDate = fromInput.value;           // "YYYY-MM-DD" or ""
    const minPlayed = Math.max(0, parseInt(minInput.value, 10) || 0);

    // Only include matches on or after the chosen date
    const matches = results.filter(r => !fromDate || (r.date && r.date >= fromDate));

    // Tally every leg by player
    const tally = new Map();
    matches.forEach(r => {
      (Array.isArray(r.legs) ? r.legs : []).forEach(leg => {
        if (leg.won !== true && leg.won !== false) return;
        const key = leg.playerId || leg.player;
        if (!key) return;
        if (!tally.has(key)) {
          tally.set(key, { name: playerNames[leg.playerId] || leg.player || "Unknown", played: 0, won: 0 });
        }
        const t = tally.get(key);
        t.played++;
        if (leg.won) t.won++;
      });
    });

    const rows = [...tally.values()]
      .filter(p => p.played >= minPlayed)
      .map(p => ({ ...p, ratio: p.played ? p.won / p.played : 0 }))
      .sort((a, b) =>
        (b.ratio - a.ratio) ||
        a.name.localeCompare(b.name, "en-GB", { sensitivity: "base" })
      );

    // Summary line
    const matchText = matches.length === 1 ? "1 match" : `${matches.length} matches`;
    countEl.textContent = fromDate ? `Based on ${matchText} since ${formatDate(fromDate)}` : `Based on ${matchText}`;

    outputEl.innerHTML = "";

    if (rows.length === 0) {
      const msg = results.length === 0
        ? "No results yet. Once matches are added on the Match Results page, player stats will show here."
        : "No players match these filters. Try a lower minimum or an earlier date.";
      outputEl.appendChild(el("p", "message", msg));
      return;
    }

    const table = el("table", "stats");
    const thead = el("thead");
    const hr = el("tr");
    ["Player", "Played", "Won", "Win %"].forEach(h => {
      const th = el("th", "", h);
      th.scope = "col";
      hr.appendChild(th);
    });
    thead.appendChild(hr);
    table.appendChild(thead);

    const tbody = el("tbody");
    rows.forEach(p => {
      const tr = el("tr");
      tr.appendChild(el("td", "", p.name));
      tr.appendChild(el("td", "", String(p.played)));
      tr.appendChild(el("td", "", String(p.won)));

      const pctTd = el("td");
      const pctWrap = el("div", "pct");
      const bar = el("div", "bar");
      const fill = el("span");
      fill.style.width = (p.ratio * 100).toFixed(1) + "%";
      bar.appendChild(fill);
      const pctText = (Math.round(p.ratio * 1000) / 10).toFixed(1) + "%";
      pctWrap.append(bar, el("span", "pct-value", pctText));
      pctTd.appendChild(pctWrap);
      tr.appendChild(pctTd);

      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    outputEl.appendChild(table);
  }

  // Live data: updates automatically when results or player names change
  onSnapshot(
    collection(db, RESULTS_COLLECTION),
    (snap) => {
      clearError();
      results = snap.docs.map(d => d.data());
      resultsLoaded = true;
      render();
    },
    (err) => {
      console.error(err);
      countEl.textContent = "Couldn't load results";
      showError("Couldn't connect to Firebase. Check the config values in performance.html and your Firestore rules.");
    }
  );

  onSnapshot(
    collection(db, PLAYERS_COLLECTION),
    (snap) => {
      playerNames = {};
      snap.docs.forEach(d => { playerNames[d.id] = d.data().name || d.id; });
      render();
    },
    (err) => console.error(err)
  );

  minInput.addEventListener("input", render);
  fromInput.addEventListener("change", render);
  clearBtn.addEventListener("click", () => {
    minInput.value = 0;
    fromInput.value = "";
    render();
  });
</script>

</body>
</html>
