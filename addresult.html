<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add Result · Stapleford Monday Night Pool Team</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --baize: #0f5a3c;
    --baize-dark: #08402a;
    --rail: #5a2e1b;
    --rail-light: #7a4127;
    --brass: #d4a94f;
    --chalk: #6fa8dc;
    --ivory: #f5f0e1;
    --red: #d22b2b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Barlow", "Helvetica Neue", Arial, sans-serif;
    color: var(--ivory);
    background:
      radial-gradient(ellipse at 50% 30%, rgba(255,255,255,0.10), transparent 60%),
      var(--baize);
    display: flex;
    justify-content: center;
    padding: 40px 24px;
    min-height: 100vh;
  }

  .table {
    width: 100%;
    max-width: 760px;
    border: 22px solid var(--rail);
    border-radius: 28px;
    background:
      repeating-linear-gradient(45deg, rgba(0,0,0,0.03) 0 2px, transparent 2px 4px),
      linear-gradient(180deg, var(--baize) 0%, var(--baize-dark) 100%);
    box-shadow:
      inset 0 0 0 3px var(--rail-light),
      inset 0 0 60px rgba(0,0,0,0.45),
      0 20px 50px rgba(0,0,0,0.5);
    padding: 40px 36px 48px;
    position: relative;
    align-self: flex-start;
  }

  .pocket {
    position: absolute;
    width: 34px; height: 34px;
    background: #000;
    border-radius: 50%;
    box-shadow: 0 0 0 4px var(--rail-light);
  }
  .p1 { top: -28px; left: -28px; }
  .p2 { top: -28px; right: -28px; }
  .p3 { bottom: -28px; left: -28px; }
  .p4 { bottom: -28px; right: -28px; }

  .back {
    display: inline-block;
    color: var(--brass);
    font-weight: 600;
    text-decoration: none;
    margin-bottom: 20px;
  }
  .back:hover { text-decoration: underline; }
  .back:focus-visible { outline: 3px solid var(--chalk); outline-offset: 3px; border-radius: 4px; }

  h1 {
    font-family: "Alfa Slab One", Georgia, serif;
    font-weight: 400;
    font-size: clamp(2rem, 6vw, 3rem);
    line-height: 1.05;
    text-shadow: 0 3px 0 rgba(0,0,0,0.35);
    margin-bottom: 28px;
  }

  h2 {
    font-family: "Alfa Slab One", Georgia, serif;
    font-weight: 400;
    font-size: 1.4rem;
    margin: 32px 0 6px;
  }
  .hint { opacity: 0.8; margin-bottom: 16px; }

  /* Match details */
  .details {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .details .date-field { grid-column: 1 / -1; max-width: 260px; }

  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label {
    font-weight: 600;
    font-size: 0.95rem;
    color: var(--brass);
    padding-left: 14px;
  }

  input, select {
    width: 100%;
    font: inherit;
    font-size: 1.05rem;
    padding: 12px 18px;
    border-radius: 999px;
    border: 2px solid transparent;
    background: rgba(0,0,0,0.25);
    color: var(--ivory);
    color-scheme: dark;
  }
  input::placeholder { color: rgba(245,240,225,0.5); }
  input:focus, select:focus { outline: none; border-color: var(--chalk); }
  select {
    appearance: none;
    cursor: pointer;
    padding-right: 40px;
    background-image:
      linear-gradient(45deg, transparent 50%, var(--ivory) 50%),
      linear-gradient(135deg, var(--ivory) 50%, transparent 50%);
    background-position: calc(100% - 22px) 52%, calc(100% - 16px) 52%;
    background-size: 6px 6px;
    background-repeat: no-repeat;
  }
  select option { background: var(--baize-dark); color: var(--ivory); }

  .invalid { border-color: var(--red) !important; }

  /* Legs */
  .legs { display: grid; gap: 10px; }

  .leg {
    display: grid;
    grid-template-columns: 4.5rem 1fr auto;
    align-items: center;
    gap: 12px;
    background: rgba(0,0,0,0.18);
    border-radius: 999px;
    padding: 6px 6px 6px 20px;
  }
  .leg-label { font-weight: 700; color: var(--brass); }

  .toggle {
    display: flex;
    background: rgba(0,0,0,0.25);
    border-radius: 999px;
    padding: 3px;
    border: 2px solid transparent;
  }
  .toggle input {
    position: absolute;
    opacity: 0;
    width: 1px; height: 1px;
  }
  .toggle label {
    padding: 8px 16px;
    border-radius: 999px;
    font-weight: 700;
    cursor: pointer;
    user-select: none;
  }
  .toggle input:checked + label.won-label { background: var(--brass); color: #1d1d1d; }
  .toggle input:checked + label.lost-label { background: var(--ivory); color: #1d1d1d; }
  .toggle input:focus-visible + label { outline: 3px solid var(--chalk); outline-offset: 1px; }

  /* Running score + save bar */
  .footer-bar {
    position: sticky;
    bottom: 12px;
    margin-top: 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    background: var(--rail);
    border-radius: 999px;
    padding: 10px 10px 10px 24px;
    box-shadow: 0 10px 24px rgba(0,0,0,0.45);
  }
  .running {
    font-family: "Alfa Slab One", Georgia, serif;
    font-size: 1.15rem;
  }

  .btn {
    font: inherit;
    font-weight: 700;
    font-size: 1.05rem;
    padding: 13px 26px;
    border: none;
    border-radius: 999px;
    background: var(--ivory);
    color: #1d1d1d;
    cursor: pointer;
    white-space: nowrap;
    box-shadow: 0 5px 0 #b9b19b, 0 8px 14px rgba(0,0,0,0.35);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 7px 0 #b9b19b, 0 12px 18px rgba(0,0,0,0.4); }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #b9b19b, 0 3px 6px rgba(0,0,0,0.35); }
  .btn:focus-visible { outline: 3px solid var(--chalk); outline-offset: 4px; }
  .btn:disabled { opacity: 0.6; cursor: wait; }

  .error {
    background: rgba(210,43,43,0.25);
    border: 2px solid var(--red);
    border-radius: 16px;
    padding: 14px 18px;
    margin-bottom: 20px;
    display: none;
  }
  .error.show { display: block; }

  @media (max-width: 600px) {
    .table { border-width: 14px; padding: 32px 16px 40px; }
    .details { grid-template-columns: 1fr; }
    .details .date-field { max-width: none; }
    .leg {
      grid-template-columns: 1fr auto;
      border-radius: 20px;
      padding: 12px;
      row-gap: 10px;
    }
    .leg-label { grid-column: 1; padding-left: 6px; }
    .leg .toggle { grid-column: 2; grid-row: 1; }
    .leg select { grid-column: 1 / -1; }
    .footer-bar { border-radius: 20px; padding: 10px 10px 10px 18px; }
    .pocket { width: 26px; height: 26px; }
    .p1, .p3 { left: -21px; }
    .p2, .p4 { right: -21px; }
    .p1, .p2 { top: -21px; }
    .p3, .p4 { bottom: -21px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .btn { transition: none; }
  }
</style>
</head>
<body>

<main class="table">
  <div class="pocket p1"></div><div class="pocket p2"></div>
  <div class="pocket p3"></div><div class="pocket p4"></div>

  <a class="back" href="results.html">‹ Back to results</a>
  <h1>Add Result</h1>

  <div class="error" id="error" role="alert"></div>

  <form id="resultForm" novalidate autocomplete="off">
    <div class="details">
      <div class="field date-field">
        <label for="date">Date</label>
        <input id="date" type="date" required>
      </div>
      <div class="field">
        <label for="homeTeam">Home team</label>
        <input id="homeTeam" type="text" placeholder="Home team" maxlength="60" required>
      </div>
      <div class="field">
        <label for="awayTeam">Away team</label>
        <input id="awayTeam" type="text" placeholder="Away team" maxlength="60" required>
      </div>
    </div>

    <h2>Legs</h2>
    <p class="hint">Choose who played each leg and whether they won or lost it.</p>
    <div class="legs" id="legs"></div>

    <div class="footer-bar">
      <span class="running" id="running">Won 0 – Lost 0</span>
      <button class="btn" type="submit" id="saveBtn">Save result</button>
    </div>
  </form>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getFirestore, collection, addDoc, getDocs, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // ── Firebase config ────────────────────────────────────────────
  // Use the same values you put in team.html
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "stapleford-pool-monday-team.firebaseapp.com",
    projectId: "stapleford-pool-monday-team",
    storageBucket: "stapleford-pool-monday-team.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  const PLAYERS_COLLECTION = "players";
  const RESULTS_COLLECTION = "results";
  const NUMBER_OF_LEGS = 13;
  // ───────────────────────────────────────────────────────────────

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const form = document.getElementById("resultForm");
  const legsEl = document.getElementById("legs");
  const runningEl = document.getElementById("running");
  const errorEl = document.getElementById("error");
  const saveBtn = document.getElementById("saveBtn");
  const dateInput = document.getElementById("date");
  const homeInput = document.getElementById("homeTeam");
  const awayInput = document.getElementById("awayTeam");

  function showError(msg) {
    errorEl.textContent = msg;
    errorEl.classList.add("show");
    errorEl.scrollIntoView({ behavior: "smooth", block: "center" });
  }
  function clearError() { errorEl.classList.remove("show"); }

  // Default the date to today
  const today = new Date();
  dateInput.value = new Date(today.getTime() - today.getTimezoneOffset() * 60000).toISOString().slice(0, 10);

  // Build the 13 leg rows
  const selects = [];
  for (let i = 1; i <= NUMBER_OF_LEGS; i++) {
    const row = document.createElement("div");
    row.className = "leg";
    row.innerHTML = `
      <label class="leg-label" for="leg${i}">Leg ${i}</label>
      <select id="leg${i}" required disabled>
        <option value="">Loading players…</option>
      </select>
      <div class="toggle" role="radiogroup" aria-label="Leg ${i} result">
        <input type="radio" name="result${i}" id="won${i}" value="won">
        <label class="won-label" for="won${i}">Won</label>
        <input type="radio" name="result${i}" id="lost${i}" value="lost">
        <label class="lost-label" for="lost${i}">Lost</label>
      </div>`;
    legsEl.appendChild(row);
    selects.push(row.querySelector("select"));
  }

  function updateRunning() {
    let won = 0, lost = 0;
    for (let i = 1; i <= NUMBER_OF_LEGS; i++) {
      const r = form.querySelector(`input[name="result${i}"]:checked`);
      if (r?.value === "won") won++;
      if (r?.value === "lost") lost++;
    }
    runningEl.textContent = `Won ${won} – Lost ${lost}`;
  }
  form.addEventListener("change", (e) => {
    updateRunning();
    e.target.classList?.remove("invalid");
    e.target.closest?.(".toggle")?.classList.remove("invalid");
  });
  form.addEventListener("input", (e) => e.target.classList?.remove("invalid"));

  // Load players from the team list into every dropdown
  try {
    const snap = await getDocs(collection(db, PLAYERS_COLLECTION));
    const players = snap.docs
      .map(d => ({ id: d.id, name: d.data().name || d.id }))
      .sort((a, b) => a.name.localeCompare(b.name, "en-GB", { sensitivity: "base" }));

    selects.forEach(sel => {
      sel.innerHTML = "";
      const placeholder = new Option(players.length ? "Choose player" : "No players on the team yet", "");
      sel.appendChild(placeholder);
      players.forEach(p => sel.appendChild(new Option(p.name, p.id)));
      sel.disabled = players.length === 0;
    });

    if (players.length === 0) {
      showError("There are no players on the team yet. Add players on The Team page first.");
    }
  } catch (err) {
    console.error(err);
    selects.forEach(sel => { sel.innerHTML = '<option value="">Couldn\'t load players</option>'; });
    showError("Couldn't load the player list. Check the config values in addresult.html and your Firestore rules.");
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    clearError();

    // Validate
    let firstInvalid = null;
    const mark = (elem) => { elem.classList.add("invalid"); firstInvalid ??= elem; };

    if (!dateInput.value) mark(dateInput);
    if (!homeInput.value.trim()) mark(homeInput);
    if (!awayInput.value.trim()) mark(awayInput);

    const legs = [];
    for (let i = 1; i <= NUMBER_OF_LEGS; i++) {
      const sel = selects[i - 1];
      const result = form.querySelector(`input[name="result${i}"]:checked`);
      if (!sel.value) mark(sel);
      if (!result) mark(sel.closest(".leg").querySelector(".toggle"));
      legs.push({
        leg: i,
        playerId: sel.value,
        player: sel.value ? sel.options[sel.selectedIndex].text : "",
        won: result ? result.value === "won" : null
      });
    }

    if (firstInvalid) {
      showError("Fill in the date, both teams, and a player and result for every leg.");
      firstInvalid.focus?.();
      return;
    }

    const legsWon = legs.filter(l => l.won).length;

    saveBtn.disabled = true;
    saveBtn.textContent = "Saving…";
    try {
      await addDoc(collection(db, RESULTS_COLLECTION), {
        date: dateInput.value,
        homeTeam: homeInput.value.trim(),
        awayTeam: awayInput.value.trim(),
        legs,
        legsWon,
        legsLost: NUMBER_OF_LEGS - legsWon,
        createdAt: serverTimestamp()
      });
      window.location.href = "results.html";
    } catch (err) {
      console.error(err);
      showError("Couldn't save the result. Check your Firestore rules allow writes to the results collection.");
      saveBtn.disabled = false;
      saveBtn.textContent = "Save result";
    }
  });
</script>

</body>
</html>
